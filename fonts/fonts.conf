<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fontconfig setup for rendering /api/og with sharp. Serverless hosts such as
  Vercel ship no system fonts, so we only use the fonts bundled in this folder.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>
</fontconfig>
